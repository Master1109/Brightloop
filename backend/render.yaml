services:
  - type: web
    name: brightloop-api
    rootDir: backend
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-app.vercel.app
      - key: APP_URL
        value: https://your-app.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: REDIS_HOST
        fromService: brightloop-redis
        type: redis
        property: host
      - key: REDIS_PORT
        fromService: brightloop-redis
        type: redis
        property: port

  - type: worker
    name: brightloop-billing
    rootDir: backend
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_TYPE
        value: worker
      - key: REDIS_HOST
        fromService: brightloop-redis
        type: redis
        property: host
      - key: REDIS_PORT
        fromService: brightloop-redis
        type: redis
        property: port

databases:
  - name: brightloop-db
    databaseName: brightloop
    plan: free

redis:
  - name: brightloop-redis
    plan: free